name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_LIVE_MODEL_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - name: Release version consistency
        run: npm run check:release
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: All Node and component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          APP_BUILD_COMMIT: ${{ github.sha }}
      - name: Standalone production smoke check
        run: npm run smoke:build
        env:
          APP_BUILD_COMMIT: ${{ github.sha }}
